<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotary Dial Bio Link - CMS & Publish Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #FAF7F0;
            --dial-outer: #A67C52;
            --dial-inner: #8C6A46;
            --center-hub: #F5EFE1;
            --hole-border: #4D4D4D;
            --text-primary: #2A2A2A;
            --text-secondary: #736F68;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            margin: 0;
            padding: 16px;
            user-select: none;
        }

        .serif-title {
            font-family: 'Playfair Display', serif;
        }

        .rotary-wrapper {
            position: relative;
            width: min(80vw, 340px);
            height: min(80vw, 340px);
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #E8DCCA 0%, var(--dial-outer) 45%, #856442 80%, #5C452D 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2), inset 0 4px 10px rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .rotary-dial {
            position: absolute;
            width: 94%;
            height: 94%;
            border-radius: 50%;
            background: radial-gradient(circle, #A67C52 0%, var(--dial-inner) 65%, #664D33 100%);
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.18), 0 8px 20px rgba(0,0,0,0.3);
            transform-origin: center center;
            cursor: grab;
        }

        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, var(--center-hub) 0%, #E8E3D4 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.09);
            border: 3px solid #736F68;
            z-index: 10;
            padding: 8px;
            pointer-events: none;
        }

        .center-hub h1 {
            font-size: clamp(13px, 3.5vw, 17px);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.15;
            margin-bottom: 2px;
        }

        .center-hub p {
            font-size: clamp(6px, 1.5vw, 9px);
            color: var(--text-secondary);
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .dial-stopper {
            position: absolute;
            bottom: 14%;
            right: 18%;
            width: 14%;
            height: 18%;
            background: linear-gradient(135deg, #E0E0E0 0%, #333333 100%);
            border-radius: 0 50% 50% 0 / 0 80% 20% 0;
            z-index: 5;
            transform: rotate(-40deg);
            pointer-events: none;
        }

        .dial-hole {
            position: absolute;
            width: 16%;
            height: 16%;
            background: radial-gradient(circle, #FFFFFF 0%, #D9D0C1 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
            border: 3px solid var(--hole-border);
            transform: translate(-50%, -50%);
            cursor: pointer;
        }

        .dial-hole i {
            font-size: 14px;
            color: #1a1a1a;
            pointer-events: none;
        }

        .card-box {
            background: #FFFFFF;
            border: 1px solid #E0E0E0;
            padding: 20px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: LOGIN / REGISTER -->
    <div id="authScreen" class="card-box text-center">
        <h2 class="serif-title text-xl font-bold mb-1">Rotary Bio CMS</h2>
        <p class="text-xs text-gray-500 mb-4">Masuk atau Buat Akun untuk Kelola Bio Link Anda</p>
        
        <div class="space-y-3 text-left">
            <div>
                <label class="text-[11px] font-semibold text-gray-600">Username / Email</label>
                <input type="text" id="usernameInput" placeholder="contoh: brandkamu" class="w-full px-3 py-2 border rounded-lg text-xs bg-gray-50 focus:outline-none focus:border-black mt-1">
            </div>
            <div>
                <label class="text-[11px] font-semibold text-gray-600">Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••" class="w-full px-3 py-2 border rounded-lg text-xs bg-gray-50 focus:outline-none focus:border-black mt-1">
            </div>
            <button onclick="handleAuth()" class="w-full bg-black text-white py-2.5 rounded-lg text-xs font-semibold hover:bg-gray-800 transition mt-2">Masuk / Buat Akun</button>
        </div>
    </div>

    <!-- SCREEN 2: ADMIN EDITOR & PUBLISH -->
    <div id="editorScreen" class="flex flex-col items-center w-full max-w-md" style="display: none;">
        <!-- Piringan Telepon Preview -->
        <div class="rotary-wrapper">
            <div class="dial-stopper"></div>
            <div class="rotary-dial" id="rotaryDial">
                <div class="center-hub">
                    <h1 id="displayName">My Brand</h1>
                    <p>PORTFOLIO</p>
                </div>
            </div>
        </div>

        <div class="card-box">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-700 serif-title">Dashboard Editor</h3>
                <div class="flex gap-1.5">
                    <button onclick="addLink()" class="text-[11px] bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg font-semibold hover:bg-emerald-700 transition"><i class="fa-solid fa-plus mr-1"></i> Tambah</button>
                    <button onclick="publishSite()" class="text-[11px] bg-black text-white px-2.5 py-1.5 rounded-lg font-semibold hover:bg-gray-800 transition"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> Publish</button>
                </div>
            </div>
            <div class="space-y-2.5">
                <input type="text" id="nameInput" placeholder="Nama Brand" oninput="updateProfile()" class="w-full px-3 py-2 border rounded-lg text-xs bg-gray-50 focus:outline-none focus:border-black">
                <div id="linksListEditor" class="space-y-2 max-h-36 overflow-y-auto pr-1"></div>
            </div>
            
            <!-- Kotak Hasil Link Publik Setelah Publish -->
            <div id="publishResult" class="mt-3 pt-3 border-t text-center" style="display: none;">
                <p class="text-[11px] text-emerald-600 font-bold mb-1"><i class="fa-solid fa-circle-check"></i> Berhasil Dipublikasikan!</p>
                <div class="flex gap-1">
                    <input type="text" id="publicLinkOutput" readonly class="w-full px-2 py-1.5 border rounded text-[10px] bg-gray-50 text-gray-600 select-all">
                    <button onclick="copyPublicLink()" class="bg-gray-900 text-white px-3 py-1.5 rounded text-[10px] font-semibold hover:bg-gray-800">Salin</button>
                </div>
            </div>
        </div>
        <button onclick="logout()" class="text-xs text-gray-500 underline mt-4 hover:text-black">Keluar Akun (Logout)</button>
    </div>

    <script>
        let currentUser = localStorage.getItem('rotary_logged_user');
        
        let defaultData = {
            brandName: "My Brand",
            links: [
                { icon: "fa-solid fa-envelope", name: "Contact", url: "mailto:hello@domain.com" },
                { icon: "fa-brands fa-instagram", name: "Instagram", url: "https://instagram.com" },
                { icon: "fa-brands fa-tiktok", name: "TikTok", url: "https://tiktok.com" }
            ]
        };

        let dbData = JSON.parse(localStorage.getItem('rotary_db_data')) || defaultData;
        let linksData = dbData.links;

        const authScreen = document.getElementById('authScreen');
        const editorScreen = document.getElementById('editorScreen');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const nameInput = document.getElementById('nameInput');
        const displayName = document.getElementById('displayName');
        const rotaryDial = document.getElementById('rotaryDial');

        if (currentUser) {
            authScreen.style.display = 'none';
            editorScreen.style.display = 'flex';
            nameInput.value = dbData.brandName;
            displayName.innerText = dbData.brandName;
            renderDial();
        }

        function handleAuth() {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();
            if(!user || !pass) {
                alert("Harap isi username dan password!");
                return;
            }
            localStorage.setItem('rotary_logged_user', user);
            authScreen.style.display = 'none';
            editorScreen.style.display = 'flex';
            nameInput.value = dbData.brandName;
            displayName.innerText = dbData.brandName;
            renderDial();
        }

        function logout() {
            localStorage.removeItem('rotary_logged_user');
            location.reload();
        }

        let currentRotation = 0, isDragging = false, startAngle = 0, initialRotation = 0;

        function renderDial() {
            const existingHoles = rotaryDial.querySelectorAll('.dial-hole');
            existingHoles.forEach(el => el.remove());

            const total = linksData.length;
            const radiusPercent = 38;

            linksData.forEach((item, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = 50 + radiusPercent * Math.cos(angle);
                const y = 50 + radiusPercent * Math.sin(angle);

                const a = document.createElement('div');
                a.className = 'dial-hole';
                a.style.left = `${x}%`;
                a.style.top = `${y}%`;
                a.title = item.name;
                
                if (item.icon && item.icon.trim() !== "") {
                    a.innerHTML = `<i class="${item.icon}"></i>`;
                } else {
                    a.innerHTML = `<span class="text-xs font-bold text-gray-700">${item.name ? item.name.charAt(0) : ''}</span>`;
                }
                
                a.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (Math.abs(currentRotation) < 5) {
                        window.open(item.url, '_blank');
                    }
                });
                rotaryDial.appendChild(a);
            });
            renderEditor();
            saveToStorage();
        }

        function saveToStorage() {
            dbData = { brandName: nameInput.value, links: linksData };
            localStorage.setItem('rotary_db_data', JSON.stringify(dbData));
        }

        function getAngle(e) {
            const rect = rotaryDial.getBoundingClientRect();
            const centerx = rect.left + rect.width / 2;
            const centery = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(clientY - centery, clientX - centerx) * (180 / Math.PI);
        }

        rotaryDial.addEventListener('mousedown', startDrag);
        rotaryDial.addEventListener('touchstart', startDrag, { passive: true });
        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag, { passive: true });
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function startDrag(e) {
            isDragging = true;
            startAngle = getAngle(e);
            initialRotation = currentRotation;
            rotaryDial.style.transition = 'none';
        }

        function drag(e) {
            if (!isDragging) return;
            let newRot = initialRotation + (getAngle(e) - startAngle);
            if (newRot < 0) newRot = 0;
            if (newRot > 200) newRot = 200;
            currentRotation = newRot;
            rotaryDial.style.transform = `rotate(${currentRotation}deg)`;
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            rotaryDial.style.transition = 'transform 0.4s ease';
            currentRotation = 0;
            rotaryDial.style.transform = `rotate(0deg)`;
        }

        function renderEditor() {
            const container = document.getElementById('linksListEditor');
            if (!container) return;
            container.innerHTML = '';
            linksData.forEach((link, idx) => {
                const row = document.createElement('div');
                row.className = "flex gap-2 items-center bg-gray-50 p-1.5 rounded border text-xs";
                row.innerHTML = `
                    <input type="text" value="${link.name}" placeholder="Nama" oninput="linksData[${idx}].name=this.value; renderDial();" class="w-1/4 px-1.5 py-1 border rounded bg-white">
                    <input type="text" value="${link.url}" placeholder="URL" oninput="linksData[${idx}].url=this.value; saveToStorage();" class="w-1/3 px-1.5 py-1 border rounded bg-white">
                    <input type="text" value="${link.icon || ''}" placeholder="Icon" oninput="linksData[${idx}].icon=this.value; renderDial();" class="w-1/3 px-1.5 py-1 border rounded bg-white">
                    <button onclick="linksData.splice(${idx},1); renderDial();" class="text-red-500 px-1 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                `;
                container.appendChild(row);
            });
        }

        function addLink() {
            if (linksData.length >= 8) {
                alert("Maksimal 8 tautan.");
                return;
            }
            linksData.push({ icon: "fa-solid fa-link", name: "Baru", url: "https://" });
            renderDial();
        }

        function updateProfile() {
            displayName.innerText = nameInput.value || "My Brand";
            saveToStorage();
        }

        function publishSite() {
            saveToStorage();
            // Ambil URL bersih tanpa parameter ?admin=true
            const cleanUrl = window.location.origin + window.location.pathname;
            
            const resultBox = document.getElementById('publishResult');
            const linkInput = document.getElementById('publicLinkOutput');
            
            linkInput.value = cleanUrl;
            resultBox.style.display = 'block';
        }

        function copyPublicLink() {
            const linkInput = document.getElementById('publicLinkOutput');
            linkInput.select();
            navigator.clipboard.writeText(linkInput.value);
            alert("Link publik berhasil disalin! Silakan pasang di bio Anda.");
        }
    </script>
</body>
</html>
