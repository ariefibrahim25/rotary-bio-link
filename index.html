<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotary Dial Bio Link - Sound Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #FAF7F0;
            --dial-outer: #A67C52;
            --dial-inner: #8C6A46;
            --center-hub: #F5EFE1;
            --hole-border: #4D4D4D;
            --text-primary: #2A2A2A;
            --text-secondary: #736F68;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            margin: 0;
            padding: 16px;
            user-select: none;
            -webkit-user-select: none;
        }

        .serif-title {
            font-family: 'Playfair Display', serif;
        }

        .rotary-wrapper {
            position: relative;
            width: min(85vw, 380px);
            height: min(85vw, 380px);
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #E8DCCA 0%, var(--dial-outer) 45%, #856442 80%, #5C452D 100%);
            box-shadow: 
                0 25px 50px rgba(0,0,0,0.22),
                inset 0 6px 15px rgba(255,255,255,0.4),
                inset 0 -10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .rotary-dial {
            position: absolute;
            width: 94%;
            height: 94%;
            border-radius: 50%;
            background: radial-gradient(circle, #A67C52 0%, var(--dial-inner) 65%, #664D33 100%);
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.18), 0 10px 30px rgba(0,0,0,0.3);
            transform-origin: center center;
            cursor: grab;
        }

        .rotary-dial:active {
            cursor: grabbing;
        }

        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, var(--center-hub) 0%, #E8E3D4 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.09), 0 8px 20px rgba(0,0,0,0.15);
            border: 3px solid #736F68;
            z-index: 10;
            padding: 10px;
            pointer-events: none;
        }

        .center-hub h1 {
            font-size: clamp(14px, 3.8vw, 19px);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.15;
            margin-bottom: 3px;
        }

        .center-hub p {
            font-size: clamp(7px, 1.8vw, 10px);
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .dial-stopper {
            position: absolute;
            bottom: 14%;
            right: 18%;
            width: 14%;
            height: 18%;
            background: linear-gradient(135deg, #E0E0E0 0%, #8C8C8C 50%, #333333 100%);
            border-radius: 0 50% 50% 0 / 0 80% 20% 0;
            box-shadow: 2px 3px 8px rgba(0,0,0,0.4);
            z-index: 5;
            transform: rotate(-40deg);
            border-left: 3px solid #1a1a1a;
            pointer-events: none;
        }

        .dial-hole {
            position: absolute;
            width: 16%;
            height: 16%;
            background: radial-gradient(circle, #FFFFFF 0%, #F0F0F0 70%, #D9D0C1 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3), 0 3px 6px rgba(255,255,255,0.3);
            border: 3.5px solid var(--hole-border);
            transform: translate(-50%, -50%);
            transition: background 0.2s, border-color 0.2s;
            cursor: pointer;
        }

        .dial-hole:hover {
            background: radial-gradient(circle, #FFFFFF 0%, #FFF4D6 100%);
            border-color: #1a1a1a;
        }

        .dial-hole i {
            font-size: clamp(13px, 3.8vw, 18px);
            color: #1a1a1a;
            pointer-events: none;
        }

        .admin-panel {
            background: #FFFFFF;
            border: 1px solid #E0E0E0;
            padding: 16px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.03);
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="flex flex-col items-center w-full max-w-md">
        <!-- Piringan Telepon -->
        <div class="rotary-wrapper">
            <div class="dial-stopper"></div>
            
            <div class="rotary-dial" id="rotaryDial">
                <div class="center-hub">
                    <h1 id="displayName">Sophia Hart</h1>
                    <p>CREATIVE STUDIO</p>
                </div>
            </div>
        </div>

        <!-- Panel Admin (Hanya muncul jika URL ada parameter ?admin=true) -->
        <div class="admin-panel" id="adminPanelContainer">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-700 serif-title">Dashboard Admin</h3>
                <div class="flex gap-2">
                    <button onclick="addLink()" class="text-xs bg-emerald-600 text-white px-2.5 py-1.5 rounded-lg font-semibold hover:bg-emerald-700 transition"><i class="fa-solid fa-plus mr-1"></i> Tambah</button>
                    <button onclick="exportCodeFile()" class="text-xs bg-black text-white px-2.5 py-1.5 rounded-lg font-semibold hover:bg-gray-800 transition">Export</button>
                </div>
            </div>
            <div class="space-y-2.5">
                <input type="text" id="nameInput" placeholder="Nama Brand" value="Sophia Hart" oninput="updateProfile()" class="w-full px-3 py-2 border rounded-lg text-xs bg-gray-50 focus:outline-none focus:border-black">
                <div id="linksListEditor" class="space-y-2 max-h-36 overflow-y-auto pr-1"></div>
            </div>
        </div>
        
        <p class="text-[11px] text-gray-500 italic mt-3 text-center" id="hintText">Putar atau tarik piringan untuk mendengarkan efek klik mekanis & membuka tautan.</p>
    </div>

    <script>
        let linksData = [
            { icon: "fa-solid fa-envelope", name: "Contact", url: "mailto:sophia@hart.co" },
            { icon: "fa-brands fa-instagram", name: "Instagram", url: "https://instagram.com" },
            { icon: "fa-brands fa-pinterest", name: "Pinterest", url: "https://pinterest.com" },
            { icon: "fa-brands fa-linkedin", name: "LinkedIn", url: "https://linkedin.com" },
            { icon: "fa-solid fa-store", name: "Shop", url: "#" },
            { icon: "fa-solid fa-podcast", name: "Podcast", url: "#" }
        ];

        const rotaryDial = document.getElementById('rotaryDial');
        const displayName = document.getElementById('displayName');
        const nameInput = document.getElementById('nameInput');

        let currentRotation = 0;
        let isDragging = false;
        let startAngle = 0;
        let initialRotation = 0;
        let lastClickDegree = 0;

        // --- FUNGSI AUDIO KLIK MEKANIS (Web Audio API) ---
        let audioCtx = null;
        function playMechanicalClick() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                // Simulasi suara klik logam telepon jadul
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.04);

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                // Abaikan jika browser memblokir audio sebelum interaksi pertama
            }
        }

        // Cek mode admin di URL (?admin=true)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === 'true') {
            document.getElementById('adminPanelContainer').style.display = 'block';
        }

        function renderDial() {
            const existingHoles = rotaryDial.querySelectorAll('.dial-hole');
            existingHoles.forEach(el => el.remove());

            const total = linksData.length;
            const radiusPercent = 38;

            linksData.forEach((item, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = 50 + radiusPercent * Math.cos(angle);
                const y = 50 + radiusPercent * Math.sin(angle);

                const a = document.createElement('div');
                a.className = 'dial-hole';
                a.style.left = `${x}%`;
                a.style.top = `${y}%`;
                a.title = item.name;
                
                if (item.icon && item.icon.trim() !== "") {
                    a.innerHTML = `<i class="${item.icon}"></i>`;
                } else {
                    a.innerHTML = `<span class="text-xs font-bold text-gray-700">${item.name ? item.name.charAt(0) : ''}</span>`;
                }
                
                a.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (Math.abs(currentRotation) < 5) {
                        playMechanicalClick();
                        window.open(item.url, '_blank');
                    }
                });

                rotaryDial.appendChild(a);
            });
            renderEditor();
        }

        function getAngle(e) {
            const rect = rotaryDial.getBoundingClientRect();
            const centerx = rect.left + rect.width / 2;
            const centery = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return Math.atan2(clientY - centery, clientX - centerx) * (180 / Math.PI);
        }

        rotaryDial.addEventListener('mousedown', startDrag);
        rotaryDial.addEventListener('touchstart', startDrag, { passive: true });

        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag, { passive: true });

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function startDrag(e) {
            isDragging = true;
            startAngle = getAngle(e);
            initialRotation = currentRotation;
            rotaryDial.style.transition = 'none';
        }

        function drag(e) {
            if (!isDragging) return;
            const angle = getAngle(e);
            let delta = angle - startAngle;
            let newRot = initialRotation + delta;
            if (newRot < 0) newRot = 0;
            if (newRot > 200) newRot = 200;

            // Trigger suara klik setiap kali piringan bergeser kelipatan 10 derajat
            if (Math.abs(newRot - lastClickDegree) >= 12) {
                playMechanicalClick();
                lastClickDegree = newRot;
            }

            currentRotation = newRot;
            rotaryDial.style.transform = `rotate(${currentRotation}deg)`;
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            playMechanicalClick();
            rotaryDial.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            currentRotation = 0;
            rotaryDial.style.transform = `rotate(0deg)`;
        }

        function renderEditor() {
            const container = document.getElementById('linksListEditor');
            if (!container) return;
            container.innerHTML = '';
            linksData.forEach((link, idx) => {
                const row = document.createElement('div');
                row.className = "flex gap-2 items-center bg-gray-50 p-1.5 rounded border text-xs";
                row.innerHTML = `
                    <input type="text" value="${link.name}" placeholder="Nama" onchange="linksData[${idx}].name=this.value; renderDial();" class="w-1/4 px-1.5 py-1 border rounded bg-white">
                    <input type="text" value="${link.url}" placeholder="URL" onchange="linksData[${idx}].url=this.value;" class="w-1/3 px-1.5 py-1 border rounded bg-white">
                    <input type="text" value="${link.icon || ''}" placeholder="Icon" onchange="linksData[${idx}].icon=this.value; renderDial();" class="w-1/3 px-1.5 py-1 border rounded bg-white">
                    <button onclick="linksData.splice(${idx},1); renderDial();" class="text-red-500 px-1 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                `;
                container.appendChild(row);
            });
        }

        function addLink() {
            if (linksData.length >= 8) {
                alert("Maksimal 8 tautan.");
                return;
            }
            linksData.push({ icon: "fa-solid fa-link", name: "Baru", url: "https://" });
            renderDial();
        }

        function updateProfile() {
            displayName.innerText = nameInput.value || "Sophia Hart";
        }

        function exportCodeFile() {
            const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([fullHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
        }

        renderDial();
    </script>
</body>
</html>
