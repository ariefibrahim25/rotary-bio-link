<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotary Dial Bio Link - Perfect Centered Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f7f5f0;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }
        .serif-title {
            font-family: 'Playfair Display', serif;
        }

        /* Wrapper Piringan Telepon Center */
        .rotary-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #e4e4e4 0%, #b8b8b8 40%, #7d7d7d 80%, #4a4a4a 100%);
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.2),
                inset 0 4px 12px rgba(255,255,255,0.7),
                inset 0 -10px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Piringan Putar Dalam */
        .rotary-dial {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #bcbcbc 0%, #9e9e9e 65%, #595959 100%);
            box-shadow: inset 0 3px 8px rgba(255,255,255,0.25), 0 8px 25px rgba(0,0,0,0.25);
            transition: transform 0.7s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            transform-origin: center center;
        }

        /* Poros Tengah (Center Hub) */
        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #fffefb 0%, #f4f0ea 70%, #ded7cb 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.12), 0 6px 15px rgba(0,0,0,0.15);
            border: 4px solid #555;
            z-index: 10;
            padding: 12px;
        }

        .center-hub h1 {
            font-size: 18px;
            font-weight: 700;
            color: #111;
            line-height: 1.15;
            margin-bottom: 3px;
        }

        .center-hub p {
            font-size: 9px;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Tuas Stopper Melengkung di Kanan Bawah */
        .dial-stopper {
            position: absolute;
            bottom: 32px;
            right: 48px;
            width: 35px;
            height: 45px;
            background: linear-gradient(135deg, #e0e0e0 0%, #9e9e9e 50%, #5e5e5e 100%);
            border-radius: 0 50% 50% 0 / 0 80% 20% 0;
            box-shadow: 2px 4px 8px rgba(0,0,0,0.3);
            z-index: 5;
            transform: rotate(-35deg);
            border-left: 2px solid #444;
            pointer-events: none;
        }

        /* Tombol Cekung Lingkaran */
        .dial-hole {
            position: absolute;
            width: 56px;
            height: 56px;
            background: radial-gradient(circle, #ffffff 0%, #f2f2f2 75%, #d1cbbd 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.25), 0 2px 5px rgba(255, 255, 255, 0.4);
            border: 3px solid #5e5e5e;
            transform: translate(-50%, -50%);
            transition: all 0.25s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .dial-hole:hover {
            background: radial-gradient(circle, #ffffff 0%, #fff8e8 100%);
            border-color: #222;
            transform: translate(-50%, -50%) scale(1.08);
        }

        .dial-hole i {
            font-size: 18px;
            color: #1a1a1a;
        }

        /* Panel Admin */
        .admin-panel {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="flex flex-col items-center">
        <!-- Frame Piringan Telepon Center -->
        <div class="rotary-wrapper">
            <div class="dial-stopper"></div>
            
            <div class="rotary-dial" id="rotaryDial">
                <!-- Poros Tengah / Label Nama -->
                <div class="center-hub">
                    <h1 id="displayName">Anna Noelle</h1>
                    <p>PORTFOLIO</p>
                </div>
                <!-- Tombol Tautan -->
            </div>
        </div>

        <!-- Panel Admin & Kustomisasi -->
        <div class="admin-panel">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-700">Admin Panel</h3>
                <div class="flex gap-2">
                    <button onclick="addLink()" class="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-emerald-700 transition"><i class="fa-solid fa-plus mr-1"></i> Add Link</button>
                    <button onclick="exportCodeFile()" class="text-xs bg-black text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-gray-800 transition">Export HTML</button>
                </div>
            </div>
            <div class="space-y-3">
                <input type="text" id="nameInput" placeholder="Nama Brand" value="Anna Noelle" oninput="updateProfile()" class="w-full px-3 py-2 border rounded-lg text-xs bg-gray-50 focus:outline-none focus:border-black">
                <div id="linksListEditor" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </div>

    <script>
        // Data Tautan & Ikon (Bisa ditambah/hapus)
        let linksData = [
            { icon: "fa-solid fa-envelope", name: "Contact", url: "mailto:hello@example.com" },
            { icon: "fa-brands fa-instagram", name: "Instagram", url: "https://instagram.com" },
            { icon: "fa-brands fa-tiktok", name: "TikTok", url: "https://tiktok.com" },
            { icon: "fa-brands fa-shopify", name: "Shop", url: "https://shopify.com" },
            { icon: "fa-brands fa-behance", name: "Portfolio", url: "https://behance.net" }
        ];

        const rotaryDial = document.getElementById('rotaryDial');
        const displayName = document.getElementById('displayName');
        const nameInput = document.getElementById('nameInput');

        function renderDial() {
            const existingHoles = rotaryDial.querySelectorAll('.dial-hole');
            existingHoles.forEach(el => el.remove());

            const total = linksData.length;
            const radius = 128; // Jarak pas dari pusat ke lingkaran tombol

            linksData.forEach((item, index) => {
                // Posisi melingkar proporsional di sisi kiri & bawah piringan
                const startAngle = -Math.PI * 1.12;
                const endAngle = Math.PI * 0.12;
                const angle = total === 1 ? -Math.PI / 2 : startAngle + (index / (total - 1)) * (endAngle - startAngle);

                // Titik tengah piringan 400px adalah 200px
                const x = 200 + radius * Math.cos(angle);
                const y = 200 + radius * Math.sin(angle);

                const a = document.createElement('a');
                a.className = 'dial-hole';
                a.href = item.url;
                a.target = "_blank";
                a.style.left = `${x}px`;
                a.style.top = `${y}px`;
                a.title = item.name;
                
                // Jika ikon diisi, tampilkan ikon. Jika kosong, tampilkan inisial/titik bersih
                if (item.icon && item.icon.trim() !== "") {
                    a.innerHTML = `<i class="${item.icon}"></i>`;
                } else {
                    a.innerHTML = `<span class="text-xs font-bold text-gray-700">${item.name ? item.name.charAt(0) : ''}</span>`;
                }
                
                // Animasi putar mekanis saat diklik
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetRotation = 45 - (index * 15);
                    rotaryDial.style.transform = `rotate(${targetRotation}deg)`;
                    
                    setTimeout(() => {
                        window.open(item.url, '_blank');
                        setTimeout(() => {
                            rotaryDial.style.transform = `rotate(0deg)`;
                        }, 400);
                    }, 350);
                });

                rotaryDial.appendChild(a);
            });
            renderEditor();
        }

        function renderEditor() {
            const container = document.getElementById('linksListEditor');
            container.innerHTML = '';
            linksData.forEach((link, idx) => {
                const row = document.createElement('div');
                row.className = "flex gap-2 items-center bg-gray-50 p-2 rounded border";
                row.innerHTML = `
                    <input type="text" value="${link.name}" placeholder="Nama" onchange="linksData[${idx}].name=this.value; renderDial();" class="w-1/4 px-2 py-1 border rounded text-xs bg-white">
                    <input type="text" value="${link.url}" placeholder="URL" onchange="linksData[${idx}].url=this.value;" class="w-1/3 px-2 py-1 border rounded text-xs bg-white">
                    <input type="text" value="${link.icon || ''}" placeholder="Icon (fa-solid fa-...)" onchange="linksData[${idx}].icon=this.value; renderDial();" class="w-1/3 px-2 py-1 border rounded text-xs bg-white">
                    <button onclick="linksData.splice(${idx},1); renderDial();" class="text-red-500 text-xs px-1 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                `;
                container.appendChild(row);
            });
        }

        function addLink() {
            if (linksData.length >= 7) {
                alert("Maksimal 7 tautan agar piringan tetap proporsional.");
                return;
            }
            linksData.push({ icon: "fa-solid fa-link", name: "Baru", url: "https://" });
            renderDial();
        }

        function updateProfile() {
            displayName.innerText = nameInput.value || "Nama";
        }

        function exportCodeFile() {
            const fullHtml = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([fullHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'rotary_bio_perfect.html';
            a.click();
        }

        renderDial();
    </script>
</body>
</html>
